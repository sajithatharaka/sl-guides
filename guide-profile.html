<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide Profile</title>
<meta name="description" content="Licensed local guide profile: credentials, languages, experience, tours and reviews.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config = {
  darkMode: 'media',
  theme: { extend: {
    fontFamily: { sans: ['Inter','system-ui','sans-serif'], display: ['"Playfair Display"','serif'] },
    colors: { leaf: { 50:'#f0f7f1', 100:'#dcebdf', 500:'#3f8a56', 600:'#2f6f44', 700:'#25583a', 900:'#12301f' }, sand: '#faf6ef' }
  } }
}
</script>
<style>
  .reveal{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body class="relative bg-sand text-stone-800 font-sans antialiased dark:bg-stone-950 dark:text-stone-200">

<div class="fixed inset-0 -z-10" aria-hidden="true">
  <img id="pageBg" alt="" class="h-full w-full object-cover">
  <div class="absolute inset-0 bg-sand/25 dark:bg-stone-950/70"></div>
</div>

<a href="#profile" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-stone-900">Skip to content</a>

<main id="profile" class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">

  <!-- Profile header card -->
  <section class="reveal overflow-hidden rounded-3xl border border-white/60 bg-white/70 backdrop-blur-md shadow-sm dark:border-stone-700/60 dark:bg-stone-900/70" aria-labelledby="gName">
    <div class="relative h-36 overflow-hidden bg-leaf-900 sm:h-48" id="cover" role="img" aria-label="Slideshow of Sri Lanka landscapes">
      <div id="slides"></div>
      <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-leaf-900/40 to-transparent"></div>
      <div id="dots" class="absolute right-4 top-4 flex gap-1.5"></div>
    </div>
    <div class="px-5 pb-6 sm:px-8 sm:pb-8">
      <div class="flex flex-col gap-5 pt-0 sm:flex-row sm:items-end sm:justify-between">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
          <img id="photo" alt="" width="144" height="144" class="-mt-14 h-28 w-28 rounded-2xl sm:-mt-16 border-4 border-white object-cover shadow-md sm:h-36 sm:w-36 dark:border-stone-900">
          <div class="sm:pt-5">
            <div class="flex items-center gap-2">
              <h1 id="gName" class="font-display text-3xl font-bold sm:text-4xl"></h1>
              <span id="verified" class="inline-flex shrink-0 cursor-help" tabindex="0" role="img">
                <svg class="h-6 w-6 sm:h-7 sm:w-7" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#1877f2" d="M12 1.5l2.6 1.9 3.2-.1 1 3.1 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3.1-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3.1-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3.1 3.2.1z"/>
                  <path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m8 12.3 2.8 2.8L16.2 9.5"/>
                </svg>
              </span>
            </div>
            <p id="gTag" class="mt-1 text-stone-600 dark:text-stone-400"></p>
            <div class="mt-3 flex flex-wrap gap-2" id="badges"></div>
          </div>
        </div>
        <div class="flex flex-wrap gap-3">
          <a id="wa" target="_blank" rel="noopener" class="inline-flex min-h-[44px] cursor-pointer items-center gap-2 rounded-full bg-leaf-600 px-5 text-sm font-semibold text-white transition hover:bg-leaf-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-leaf-600">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12Z"/></svg>
            WhatsApp
          </a>
          <a id="mail" class="inline-flex min-h-[44px] cursor-pointer items-center gap-2 rounded-full border border-stone-300 px-5 text-sm font-semibold transition hover:bg-stone-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-leaf-600 dark:border-stone-700 dark:hover:bg-stone-800">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            Email
          </a>
        </div>
      </div>

      <p id="gIntro" class="mt-6 max-w-3xl leading-relaxed text-stone-700 dark:text-stone-300"></p>

      <dl id="stats" class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4"></dl>
    </div>
  </section>

  <div class="mt-6 grid gap-6 lg:grid-cols-3">

    <!-- Left column -->
    <div class="space-y-6 lg:col-span-2">
      <section class="reveal rounded-3xl border border-white/60 bg-white/70 backdrop-blur-md p-6 shadow-sm sm:p-8 dark:border-stone-700/60 dark:bg-stone-900/70" aria-labelledby="hStory">
        <h2 id="hStory" class="font-display text-2xl font-bold">My story</h2>
        <div id="story" class="mt-4 space-y-4 leading-relaxed text-stone-700 dark:text-stone-300"></div>
      </section>

      <section class="reveal rounded-3xl border border-white/60 bg-white/70 backdrop-blur-md p-6 shadow-sm sm:p-8 dark:border-stone-700/60 dark:bg-stone-900/70" aria-labelledby="hExp">
        <h2 id="hExp" class="font-display text-2xl font-bold">Experience</h2>
        <ol id="exp" class="mt-5 space-y-6 border-l-2 border-leaf-100 pl-6 dark:border-leaf-900"></ol>
      </section>

      <section class="reveal rounded-3xl border border-white/60 bg-white/70 backdrop-blur-md p-6 shadow-sm sm:p-8 dark:border-stone-700/60 dark:bg-stone-900/70" aria-labelledby="hTours">
        <h2 id="hTours" class="font-display text-2xl font-bold">Signature tours</h2>
        <div id="tours" class="mt-5 grid gap-4 sm:grid-cols-3"></div>
      </section>

      <section class="reveal rounded-3xl border border-white/60 bg-white/70 backdrop-blur-md p-6 shadow-sm sm:p-8 dark:border-stone-700/60 dark:bg-stone-900/70" aria-labelledby="hRev">
        <h2 id="hRev" class="font-display text-2xl font-bold">Traveller reviews</h2>
        <div id="reviews" class="mt-5 space-y-4"></div>
      </section>
    </div>

    <!-- Right column -->
    <aside class="space-y-6">
      <section class="reveal rounded-3xl border border-white/60 bg-white/70 backdrop-blur-md p-6 shadow-sm dark:border-stone-700/60 dark:bg-stone-900/70" aria-labelledby="hDet">
        <h2 id="hDet" class="font-display text-xl font-bold">Credentials</h2>
        <dl id="details" class="mt-4 divide-y divide-stone-100 text-sm dark:divide-stone-800"></dl>
      </section>

      <section class="reveal rounded-3xl border border-white/60 bg-white/70 backdrop-blur-md p-6 shadow-sm dark:border-stone-700/60 dark:bg-stone-900/70" aria-labelledby="hLang">
        <h2 id="hLang" class="font-display text-xl font-bold">Languages</h2>
        <ul id="langs" class="mt-4 space-y-4"></ul>
      </section>

      <section class="reveal rounded-3xl bg-leaf-700 p-6 text-white shadow-sm dark:bg-leaf-900">
        <h2 class="font-display text-xl font-bold">Ready to explore?</h2>
        <p class="mt-2 text-sm text-leaf-100">Message me your dates and interests and I'll shape a route around you.</p>
        <a id="wa2" target="_blank" rel="noopener" class="mt-4 inline-flex min-h-[44px] cursor-pointer items-center rounded-full bg-white px-5 text-sm font-semibold text-leaf-700 transition hover:bg-leaf-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">Plan my trip</a>
      </section>
    </aside>
  </div>
</main>

<script src="data.js"></script>
<script>
(function () {
  var G = window.GUIDE;
  var $ = function (id) { return document.getElementById(id); };
  // Escape text so data.js values are never treated as markup.
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };

  document.title = G.name + ' · Guide Profile';
  $('pageBg').src = 'images/animated%20bg.gif';

  // Cover slideshow: crossfade through G.heroSlides
  var slideBox = $('slides'), dotBox = $('dots'), cur = 0;
  G.heroSlides.forEach(function (src, i) {
    var im = document.createElement('img');
    im.src = src; im.alt = ''; im.loading = i ? 'lazy' : 'eager';
    im.className = 'absolute inset-0 h-full w-full object-cover transition-opacity duration-1000 ' + (i ? 'opacity-0' : 'opacity-100');
    slideBox.appendChild(im);
    var d = document.createElement('span');
    d.className = 'h-1.5 rounded-full bg-white transition-all ' + (i ? 'w-1.5 opacity-60' : 'w-4');
    dotBox.appendChild(d);
  });
  function show(n) {
    var ims = slideBox.children, ds = dotBox.children;
    ims[cur].classList.replace('opacity-100', 'opacity-0');
    ds[cur].className = 'h-1.5 w-1.5 rounded-full bg-white opacity-60 transition-all';
    cur = n;
    ims[cur].classList.replace('opacity-0', 'opacity-100');
    ds[cur].className = 'h-1.5 w-4 rounded-full bg-white transition-all';
  }
  if (G.heroSlides.length > 1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(function () { show((cur + 1) % G.heroSlides.length); }, 4500);
  }
  $('photo').src = G.photo; $('photo').alt = 'Portrait of ' + G.name;
  $('gName').textContent = G.name;
  var vText = 'Verified guide · Licence ' + G.details['Licence no.'];
  $('verified').title = vText; $('verified').setAttribute('aria-label', vText);
  $('gTag').textContent = G.tagline;
  $('gIntro').textContent = G.intro;

  var wa = 'https://wa.me/' + G.whatsapp;
  $('wa').href = wa; $('wa2').href = wa;
  $('mail').href = 'mailto:' + G.email;

  var badge = function (t) { return '<span class="rounded-full bg-leaf-50 px-3 py-1 text-xs font-semibold text-leaf-700 dark:bg-leaf-900 dark:text-leaf-100">' + esc(t) + '</span>'; };
  $('badges').innerHTML = ['Verified profile', G.details['Licence type'], G.details['Based in'], 'First aid certified'].map(badge).join('');

  $('stats').innerHTML = G.stats.map(function (s) {
    var v = s.decimals ? s.value.toFixed(s.decimals) : s.value.toLocaleString();
    return '<div class="rounded-2xl bg-sand p-4 text-center dark:bg-stone-800"><dd class="font-display text-2xl font-bold text-leaf-700 dark:text-leaf-100">' + esc(v + s.suffix) + '</dd><dt class="mt-1 text-xs text-stone-600 dark:text-stone-400">' + esc(s.label) + '</dt></div>';
  }).join('');

  $('story').innerHTML = G.story.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');

  $('exp').innerHTML = G.experience.map(function (e) {
    return '<li class="relative"><span class="absolute -left-[31px] top-1.5 h-3 w-3 rounded-full border-2 border-white bg-leaf-600 dark:border-stone-900"></span>' +
      '<p class="text-xs font-semibold uppercase tracking-wide text-leaf-600 dark:text-leaf-500">' + esc(e.year) + '</p>' +
      '<h3 class="mt-1 font-semibold">' + esc(e.title) + '</h3>' +
      '<p class="mt-1 text-sm text-stone-600 dark:text-stone-400">' + esc(e.text) + '</p></li>';
  }).join('');

  $('tours').innerHTML = G.packages.map(function (p) {
    return '<article class="overflow-hidden rounded-2xl border border-stone-200 dark:border-stone-800">' +
      '<img src="' + esc(p.img) + '" alt="" loading="lazy" class="h-28 w-full object-cover">' +
      '<div class="p-4"><h3 class="font-semibold">' + esc(p.name) + '</h3>' +
      '<p class="mt-1 text-sm text-stone-600 dark:text-stone-400">' + esc(p.days) + ' · from <b class="text-leaf-700 dark:text-leaf-100">' + esc(p.price) + '</b></p></div></article>';
  }).join('');

  var star = '<svg class="h-4 w-4 fill-amber-400" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>';
  $('reviews').innerHTML = G.reviews.map(function (r) {
    return '<figure class="rounded-2xl bg-sand p-5 dark:bg-stone-800"><div class="flex gap-0.5" role="img" aria-label="' + r.rating + ' out of 5 stars">' + star.repeat(r.rating) + '</div>' +
      '<blockquote class="mt-3 text-sm leading-relaxed">“' + esc(r.text) + '”</blockquote>' +
      '<figcaption class="mt-3 text-sm font-semibold">' + esc(r.name) + ' <span class="font-normal text-stone-600 dark:text-stone-400">· ' + esc(r.from) + '</span></figcaption></figure>';
  }).join('');

  $('details').innerHTML = Object.keys(G.details).map(function (k) {
    return '<div class="flex justify-between gap-4 py-2.5"><dt class="text-stone-600 dark:text-stone-400">' + esc(k) + '</dt><dd class="text-right font-medium">' + esc(G.details[k]) + '</dd></div>';
  }).join('');

  $('langs').innerHTML = G.languages.map(function (l) {
    return '<li><div class="flex justify-between text-sm"><span class="font-medium">' + esc(l.name) + '</span><span class="text-stone-600 dark:text-stone-400">' + esc(l.level) + '</span></div>' +
      '<div class="mt-1.5 h-2 overflow-hidden rounded-full bg-stone-100 dark:bg-stone-800"><div class="h-full rounded-full bg-leaf-600" style="width:' + Number(l.pct) + '%"></div></div></li>';
  }).join('');

  var els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) { en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .08 });
    els.forEach(function (el) { io.observe(el); });
  } else { els.forEach(function (el) { el.classList.add('in'); }); }
})();
</script>
</body>
</html>
